# Beispielkonfiguration für den HFT-Trading-Bot-Stack.
# Nach config/config.yaml kopieren (gitignored) und anpassen. Geheimnisse gehören
# in Umgebungsvariablen oder einen Secrets-Manager — niemals echte API-Keys committen.

engine:
  mode: paper          # paper | backtest | live   (Live sendet ECHTE Orders)
  symbol: DEMO
  starting_cash: 100000

strategy:
  name: momentum       # momentum | market_making
  momentum:
    fast_period: 10
    slow_period: 30
    target_position: 50
    max_order_size: null    # optional: max. Ordergröße; stückelt große Flips
  market_making:
    quote_size: 10
    spread_bps: 10
    max_inventory: 100
    inventory_skew_bps: 5

risk:
  max_order_quantity: 200
  max_position: 500
  max_gross_exposure: 250000
  max_notional_per_order: 100000
  max_drawdown: 20000        # Handel stoppen, sobald so viel Kapital verloren ist

execution:
  commission_rate: 0.0005    # 5 Basispunkte pro Trade
  slippage_bps: 1.0

data:
  feed: simulated            # simulated | csv
  simulated:
    n_ticks: 5000
    volatility: 0.0008
    seed: 42
  csv:
    path: data/sample_ticks.csv

# Live-Trading: echte Börsenanbindung über ccxt (pip install ".[live]").
# ACHTUNG — ECHTES GELD. Erst im Testnet testen, dann mit kleinem Volumen starten.
# Zugangsdaten ausschließlich über Umgebungsvariablen setzen.
exchange:
  name: binance
  api_key: ${EXCHANGE_API_KEY}
  api_secret: ${EXCHANGE_API_SECRET}
  testnet: true              # auf false nur mit allow_mainnet=True im Code
