[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-trading-bot-stack"
version = "0.1.0"
description = "An event-driven algorithmic / high-frequency trading bot stack with paper trading and backtesting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]
live = [
    "ccxt>=4.0",  # echte Börsenanbindung (Crypto)
]

[project.scripts]
hft-backtest = "scripts.run_backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
